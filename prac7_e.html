<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="notebook-paper">
        <!-- Header Section for Page and Date -->
        <div class="notebook-header">
            <div class="meta-box">
                <div class="meta-row">PAGE NO. <span class="line"></span></div>
                <div class="meta-row">DATE <span class="date-slashes">/ /</span></div>
            </div>
        </div>
        
        <!-- Double Pink Top Margin Line -->
        <div class="top-margin-border"></div>

        <!-- Vertical Left Margin Lines -->
        <div class="left-margin-line line-1"></div>
        <div class="left-margin-line line-2"></div>

        <!-- Content Area with Blue Writing Lines -->
        <div class="content" contenteditable="true">
            <!-- You can type your text directly here -->
            <p>Start writing your notes here...</p>
            <p>Press enter to automatically align your text to the next blue line.</p>
            <p>hey i am vidhya</p>
            <p>hy i am Dhruvi </p>
        </div>
    </div>

</body>
</html>
